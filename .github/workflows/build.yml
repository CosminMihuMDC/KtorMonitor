name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/site/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Run unit tests
        run: ./gradlew jvmTest :mcp:companion:test

#      - name: Upload test reports
#        uses: actions/upload-artifact@v7
#        with:
#          name: test-reports
#          path: "**/build/reports/tests/"

  api-check:
    name: Api Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Run api check
        run: ./gradlew apiCheck
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, api-check]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build Android APKs
        run: ./gradlew :sample:ktor:androidApp:assembleDebug :sample:okhttp:androidApp:assembleDebug :sample:http4k:androidApp:assembleDebug

#      - name: Upload Android APKs
#        uses: actions/upload-artifact@v7
#        with:
#          name: android-apks
#          path: "**/build/outputs/apk/**/*.apk"

  build-web-js:
    name: Build Web JS
    runs-on: ubuntu-latest
    needs: [test, api-check]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build JS bundle
        run: ./gradlew :sample:ktor:webApp:jsBrowserProductionWebpack

  build-web-wasm:
    name: Build Web Wasm
    runs-on: ubuntu-latest
    needs: [test, api-check]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build Wasm bundle
        run: ./gradlew :sample:ktor:webApp:wasmJsBrowserProductionWebpack

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    needs: [test, api-check]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
          -project sample/ktor/iosApp/iosApp.xcodeproj \
          -configuration Debug \
          -scheme ios \
          -sdk iphonesimulator \
          -arch arm64 \
          -derivedDataPath ./build \
          -verbose

#      - name: Upload App Folder
#        uses: actions/upload-artifact@v7
#        with:
#          name: iphonesimulator-app
#          path: build/Build/Products/Debug-iphonesimulator/*

  build-desktop-macos:
    name: Build Desktop macOS
    runs-on: macos-latest
    needs: [test, api-check]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build macOS DMGs
        run: ./gradlew :sample:ktor:jvmApp:packageDmg :sample:okhttp:jvmApp:packageDmg :sample:http4k:jvmApp:packageDmg

#      - name: Upload macOS DMGs
#        uses: actions/upload-artifact@v7
#        with:
#          name: desktop-macos-dmg
#          path: "**/build/compose/binaries/main/dmg/*.dmg"

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    needs: [test, api-check]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build Windows MSIs
        run: ./gradlew :sample:ktor:jvmApp:packageMsi :sample:okhttp:jvmApp:packageMsi :sample:http4k:jvmApp:packageMsi

#      - name: Upload Windows MSIs
#        uses: actions/upload-artifact@v7
#        with:
#          name: desktop-windows-msi
#          path: "**/build/compose/binaries/main/msi/*.msi"

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    needs: [test, api-check]
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.0

      - name: Build Linux DEBs and RPMs
        run: ./gradlew :sample:ktor:jvmApp:packageDeb :sample:ktor:jvmApp:packageRpm :sample:okhttp:jvmApp:packageDeb :sample:okhttp:jvmApp:packageRpm :sample:http4k:jvmApp:packageDeb :sample:http4k:jvmApp:packageRpm

#      - name: Upload Linux DEBs and RPMs
#        uses: actions/upload-artifact@v7
#        with:
#          name: desktop-linux-deb
#          path: |
#            **/build/compose/binaries/main/deb/*.deb
#            **/build/compose/binaries/main/rpm/*.rpm
